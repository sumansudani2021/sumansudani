version: "3.8"
services:
  postgres:
    image: postgres:9.5
    restart: unless-stopped
    container_name: postgres-container
    ports:
        - "5432:5432"
    environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: password
    volumes:
        - pg_data:/var/lib/postgresql/data
volumes:
  pg_data: