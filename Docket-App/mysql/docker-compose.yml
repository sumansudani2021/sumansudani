version: "3.8"
services:
  mysql:
    image: mysql:5.7
    restart: unless-stopped
    container_name: mysql-container
    ports:
        - "3306:3306"
    environment:
        MYSQL_USER: admin
        MYSQL_PASSWORD: password
        MYSQL_ROOT_PASSWORD: password
    volumes:
        - mysql_data:/var/lib/mysql
volumes:
  mysql_data: